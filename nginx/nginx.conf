server {
  listen 80;
  index index.html;
  
  location /static/backend/ {
    alias /static/;
  }

  location /media/ {
    alias /media/;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location / {
    alias /static/frontend_static/;
    try_files $uri /index.html;
  }
}