[flake8]

ignore = 
    W503,
    F811,
    F401,
    F403,
    F405,
    E402 


exclude = 
    tests/,
    */migrations/,
    venv/,
    */venv/,
    env/,
    */env/,

per-file-ignores =
    */settings.py:E501

import-order-style = google  # Отключает проверку порядка импортов
disable-noqa = False         # Разрешает использовать # noqa комментарии